[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovis"
version = "0.1.0"
description = "Visualize advanced concepts in mathematical optimization, analysis, and topology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
topology = ["ripser>=0.6"]
dev = ["pytest>=7"]

[project.scripts]
ovis = "ovis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
